<head>
<meta charset="utf-8">
<title>Baner Kick</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  .banner {
    width: 1080px; height: 540px; box-sizing: border-box; padding: 40px 48px;
    display: flex; flex-direction: column; gap: 28px;
    font-family: 'Inter', sans-serif; color: #fff;
  }
  .top {
    flex: 1; display: flex; align-items: center; gap: 36px;
    background: rgba(20,20,22,.92); border: 2px solid #2a2a2e; border-radius: 28px;
    padding: 0 40px; box-shadow: 0 0 40px rgba(83,252,24,.15);
  }
  .logo {
    width: 190px; height: 190px; flex: none; border-radius: 22px;
    display: flex; align-items: center; justify-content: center; background: #0b0b0c;
  }
  .logo img { width: 190px; height: 190px; border-radius: 22px; object-fit: contain; }
  .url { font-weight: 800; font-size: 66px; letter-spacing: -1px; white-space: nowrap; line-height: 1; }
  .url span { color: #53FC18; }
  .bottom {
    height: 150px; display: flex; align-items: center; justify-content: center; gap: 26px;
    background: rgba(20,20,22,.92); border: 2px solid #2a2a2e; border-radius: 24px; color: #53FC18; flex-direction: column; gap: 4px;
  }
  .bottom svg { width: 70px; height: 70px; flex: none; }
  .cta { text-align: center; font-family: 'Anton', Impact, 'Arial Narrow', sans-serif; font-size: 64px; white-space: nowrap; text-transform: uppercase; line-height: 1; }
  .cta small { display: block; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 34px; text-transform: none; margin-top: 8px; color: #fff; text-align: center; }
</style>
